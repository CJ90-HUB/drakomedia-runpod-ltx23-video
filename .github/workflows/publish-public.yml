name: Publish public LTX worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - handler.py
      - contract.py
      - download_models.py
      - requirements.txt
      - .github/workflows/publish-public.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: imjasonh/setup-crane@v0.4

      - name: Create worker patch layer
        run: |
          tar -czf /tmp/worker-patch.tgz \
            --transform='s,^,app/,' \
            handler.py contract.py

      - name: Publish immutable worker patch
        env:
          BASE_IMAGE: ghcr.io/cj90-hub/drakomedia-ltx23-video-public@sha256:05506e48ed5d3602bbcb02f3e0f8d0b566082b29724b1585c3ff602d0f596ed7
          TARGET_IMAGE: ghcr.io/cj90-hub/drakomedia-ltx23-video-public
        run: |
          crane mutate "$BASE_IMAGE" \
            --append /tmp/worker-patch.tgz \
            --tag "$TARGET_IMAGE:${GITHUB_SHA}"
          crane tag "$TARGET_IMAGE:${GITHUB_SHA}" latest
