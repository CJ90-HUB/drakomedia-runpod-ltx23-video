name: Publish split Cloud workers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - Dockerfile.motion
      - handler.py
      - video_contract.py
      - video_only_distilled.py
      - motion_handler.py
      - contract.py
      - test_video_contract.py
      - test_video_persistence.py
      - test_video_runtime_contract.py
      - test_video_only_source.py
      - download_models.py
      - requirements.txt
      - requirements.motion.txt
      - requirements.salad.txt
      - Dockerfile.salad
      - salad_assets.py
      - salad_server.py
      - start-salad.sh
      - .github/workflows/publish-public.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Publish lightweight LTX worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/cj90-hub/drakomedia-ltx23-video-public:video-${{ github.sha }}
            ghcr.io/cj90-hub/drakomedia-ltx23-video-public:video-latest
          cache-from: type=gha,scope=ltx-video
          cache-to: type=gha,mode=max,scope=ltx-video

      - name: Publish lightweight Gemma motion director
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.motion
          push: true
          tags: |
            ghcr.io/cj90-hub/drakomedia-ltx23-video-public:motion-${{ github.sha }}
            ghcr.io/cj90-hub/drakomedia-ltx23-video-public:motion-latest
          cache-from: type=gha,scope=gemma-motion
          cache-to: type=gha,mode=max,scope=gemma-motion

      - name: Publish SaladCloud LTX worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.salad
          push: true
          tags: |
            ghcr.io/cj90-hub/drakomedia-ltx23-video-public:salad-${{ github.sha }}
            ghcr.io/cj90-hub/drakomedia-ltx23-video-public:salad-latest
          cache-from: type=gha,scope=ltx-salad
          cache-to: type=gha,mode=max,scope=ltx-salad
